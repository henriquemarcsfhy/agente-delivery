[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-delivery"
version = "0.1.0"
description = "Agente de pedidos de delivery com LLM, function calling, guardrails e avaliação"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40",
    # Windows não traz o banco de fusos IANA; sem isso ZoneInfo("America/Sao_Paulo") falha.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
agente-delivery = "agente_delivery.chat:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agente_delivery = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Prompts e mensagens ao modelo são strings longas de propósito; o formatter cuida do código.
ignore = ["E501"]
